<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#fbf7f4;color:#2b1d24;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:400;font-size:28px;margin:16px 0 8px}
  p{color:#5c4a53;max-width:320px;margin:0 auto 24px}
  button{background:#8a3d5c;color:#fff;border:0;border-radius:999px;padding:12px 24px;font-size:15px}
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" width="72" height="72" alt="" style="border-radius:18px">
    <h1>Você está sem internet</h1>
    <p>A agenda precisa de conexão para mostrar os horários atualizados. Assim que a internet voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
