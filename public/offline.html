<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#faf7f7;color:#1c1719;font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  h1{font-weight:700;font-size:26px;letter-spacing:-.02em;margin:16px 0 8px}
  p{color:#4d4447;max-width:320px;margin:0 auto 24px}
  button{background:#000;color:#fff;border:0;border-radius:999px;padding:14px 26px;font-size:15px;font-weight:600}
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" width="72" height="72" alt="" style="border-radius:18px">
    <h1>Você está sem internet</h1>
    <p>O app precisa de conexão para mostrar os horários atualizados. Assim que a internet voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
